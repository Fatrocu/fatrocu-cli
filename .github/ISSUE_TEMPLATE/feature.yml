name: ✨ Feature Request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ## Feature Request 💡

        Thank you for suggesting a new feature! Please fill out the information below so we can better understand your needs.

  - type: textarea
    id: feature
    attributes:
      label: Feature Description
      description: "What feature would you like to see?"
      placeholder: "Describe the feature you'd like to see added..."
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: "Why is this feature needed? What problem does it solve?"
      placeholder: "Explain why this feature is important..."
    validations:
      required: true

  - type: textarea
    id: examples
    attributes:
      label: Examples / Use Cases
      description: "Show examples of how you would use this feature."
      placeholder: "Show examples of how you would use this feature..."

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: "Have you considered other solutions? Why is this feature better?"
      placeholder: "Describe alternatives you've considered..."

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: "Add any other context, mockups, diagrams, or references."
      placeholder: "Add any other context or screenshots..."

  - type: input
    id: priority
    attributes:
      label: Priority
      description: "How urgently do you need this feature?"
      placeholder: "Low / Medium / High / Critical"
    validations:
      required: true
