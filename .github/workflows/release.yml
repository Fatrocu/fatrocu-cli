name: Build release candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --all-targets
      - run: cargo build --locked --release
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-candidate-${{ matrix.os }}
          path: |
            target/release/fatrocu-cli*
            target/release/fatrocu-updater*
# Signing, private accuracy gates and stable release publication are separate manual steps.
