[package]
name = "fatrocu"
version = "3.1.0"
edition = "2021"
authors = ["Nec0ti <nec0ti@proton.me>"]
description = "Fatrocu CLI — ImajeV-2B powered invoice processing. OCR + extraction in one pass."
license = "MIT"
repository = "https://github.com/Nec0ti/Fatrocu"
keywords = ["invoice", "ocr", "ai", "cli", "imajev", "extraction"]
categories = ["command-line-utilities", "document-management"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "blocking"], default-features = false }
dirs = "5.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
colored = "2.1"
anyhow = "1.0"
thiserror = "1.0"
anyhow = "1.0"
zip = "2.1"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
panic = "abort"

[[bin]]
name = "fatrocu"
path = "src/main.rs"
