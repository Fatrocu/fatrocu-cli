[package]
name = "fatrocu-cli"
version = "3.1.0"
edition = "2024"
description = "Fatrocu CLI — İmajeV-2B-Q8_0 ile fatura işleme"
authors = ["Nec0ti"]
license = "MIT"
repository = "https://github.com/Nec0ti/Fatrocu"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
chrono = "0.4"
pathfinder_text = "0.5"
image = "0.25"
rayon = "1.10"
tempfile = "3.10"
shell-words = "1.1"
csv = "1.3"

[profile.release]
lto = true
opt-level = "z"
codegen-units = 1